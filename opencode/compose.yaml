# Machine B — OpenCode (air-gapped) + hardened model gateway.
#
#   opencode ── net: agent (internal, no default route, zero egress)
#   gateway  ── net: agent + outbound; fixed upstream = Machine A's nginx
#
# Host visibility of the opencode container is EXACTLY:
#   ${WORKSPACE_DIR}  (read-write; host path, set in .env, default ./workspace)
#   ./opencode.json   (read-only)
# No published ports. No docker socket. Not privileged.
name: secure-llm-opencode

services:
  opencode:
    build:
      context: .
      args:
        # .env (not CLI flags) selects the build-time toolchain
        TOOLS: ${TOOLS:-git ripgrep fd ast-grep jq}
    image: secure-llm/opencode:local
    working_dir: /workspace
    volumes:
      # Host dir is overridable via WORKSPACE_DIR in .env (default ./workspace);
      # the container always sees it at /workspace:
      - ${WORKSPACE_DIR:-./workspace}:/workspace
      - ./opencode.json:/home/coder/.config/opencode/opencode.json:ro
    environment:
      TERM: xterm-256color
    networks:
      - agent
    depends_on:
      - gateway
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  gateway:
    image: nginx:stable-alpine
    # Hardened: run entirely unprivileged, read-only rootfs, no capabilities.
    user: "101:101"
    read_only: true
    # uid/gid/mode so the unprivileged nginx user (101) can write its
    # temp dirs — a plain root-owned tmpfs breaks startup.
    tmpfs:
      - /var/cache/nginx:uid=101,gid=101,mode=1755
      - /var/run:uid=101,gid=101,mode=1777
      - /var/log/nginx:uid=101,gid=101,mode=1755
    volumes:
      - ./gateway.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - agent
      - outbound # the only network in this project with egress
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # No published ports — reachable only from containers on `agent`.
    restart: unless-stopped

networks:
  agent:
    internal: true
  outbound:
    driver: bridge
