# Machine B model gateway: fixed-upstream reverse proxy.
#
# The ONLY destination this gateway can ever reach is Machine A's nginx.
# Client-supplied Host headers change request metadata only; the TCP
# connection destination is hardcoded below.
server {
    listen 8080;

    location / {
        # EDIT ME: Machine A's LAN IP (keep in sync with A_LAN_IP in .env)
        proxy_pass http://192.168.1.10:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off; # SSE streaming
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_max_body_size 16m;
    }
}
